<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>St. Paul's Young Adults · Check In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:#0F6E56; --green-light:#E1F5EE; --green-mid:#9FE1CB; --green-dark:#085041;
      --blue:#185FA5; --blue-light:#E6F1FB; --red:#A32D2D; --red-light:#FCEBEB;
      --amber-light:#FAEEDA; --amber-dark:#633806; --purple:#534AB7; --purple-light:#EEEDFE;
      --text:#111; --text-2:#555; --text-3:#999; --bg:#fff; --bg-2:#f7f7f5; --bg-3:#ededeb;
      --border:#e5e5e3; --border-2:#d0d0ce; --radius:8px; --radius-lg:12px;
    }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--bg-2); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:0 1rem 3rem; }
    .app { width:100%; max-width:420px; }
    .header { padding:1.25rem 0 1rem; border-bottom:0.5px solid var(--border); margin-bottom:1.25rem; display:flex; justify-content:space-between; align-items:flex-start; }
    .header h1 { font-size:18px; font-weight:500; }
    .header p { font-size:13px; color:var(--text-2); margin-top:2px; }
    .nav-link { font-size:12px; color:var(--text-2); text-decoration:none; border:0.5px solid var(--border-2); padding:6px 10px; border-radius:var(--radius); white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
    .nav-link:hover { background:var(--bg); }
    .tab-row { display:flex; gap:6px; margin-bottom:1.25rem; }
    .tab { flex:1; padding:8px 4px; font-size:13px; font-family:inherit; border:0.5px solid var(--border-2); border-radius:var(--radius); background:var(--bg); cursor:pointer; color:var(--text-2); }
    .tab.active { background:var(--text); color:var(--bg); border-color:var(--text); }
    input, select { width:100%; padding:9px 12px; font-size:14px; font-family:inherit; border:0.5px solid var(--border-2); border-radius:var(--radius); background:var(--bg); color:var(--text); outline:none; }
    input:focus, select:focus { border-color:var(--green); }
    input[type=password] { letter-spacing:0.1em; }
    .seg { display:flex; gap:0; margin-bottom:0.75rem; border:0.5px solid var(--border-2); border-radius:var(--radius); overflow:hidden; }
    .seg button { flex:1; padding:8px; font-size:13px; font-family:inherit; background:var(--bg); border:none; cursor:pointer; color:var(--text-2); }
    .seg button.active { background:var(--text); color:var(--bg); }
    .search-wrap { position:relative; margin-bottom:0.75rem; }
    .search-wrap i { position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:16px; color:var(--text-3); pointer-events:none; }
    .search-wrap input { padding-left:34px; }
    .event-select { margin-bottom:1.25rem; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 14px; font-size:14px; font-family:inherit; font-weight:500; border-radius:var(--radius); cursor:pointer; border:none; }
    .btn:active { opacity:0.82; }
    .btn-primary { background:var(--text); color:var(--bg); width:100%; }
    .btn-outline { background:var(--bg); color:var(--text); border:0.5px solid var(--border-2); }
    .btn-outline:hover { background:var(--bg-2); }
    .btn-sm { padding:6px 10px; font-size:12px; }
    .btn-danger { color:var(--red); border-color:#F09595; background:transparent; }
    .btn-danger:hover { background:var(--red-light); }
    .roster { display:flex; flex-direction:column; gap:6px; max-height:300px; overflow-y:auto; margin-bottom:1rem; }
    .member-btn { display:flex; align-items:center; gap:10px; background:var(--bg); border:0.5px solid var(--border); border-radius:var(--radius); padding:10px 12px; cursor:pointer; text-align:left; width:100%; font-family:inherit; }
    .member-btn:hover { background:var(--bg-2); }
    .member-btn.ci { border-color:var(--green); background:var(--green-light); }
    .member-btn.static { cursor:default; }
    .avatar { width:36px; height:36px; border-radius:50%; background:var(--blue-light); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:500; color:var(--blue); flex-shrink:0; }
    .avatar.green { background:var(--green-mid); color:var(--green-dark); }
    .avatar.amber { background:var(--amber-light); color:var(--amber-dark); }
    .member-name { font-size:14px; font-weight:500; }
    .member-sub { font-size:12px; color:var(--text-2); }
    .check-icon { color:var(--green); font-size:18px; margin-left:auto; }
    .divider { font-size:11px; font-weight:500; color:var(--text-3); text-transform:uppercase; letter-spacing:0.06em; margin:1rem 0 0.5rem; }
    .surface { background:var(--bg-2); border-radius:var(--radius-lg); padding:1rem; margin-bottom:1rem; }
    .field { margin-bottom:0.75rem; }
    .field label { display:block; font-size:12px; color:var(--text-2); margin-bottom:4px; }
    .card { background:var(--bg); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:1rem 1.25rem; margin-bottom:1rem; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:1.25rem; }
    .stat { background:var(--bg-2); border-radius:var(--radius); padding:0.75rem; }
    .stat-val { font-size:24px; font-weight:500; }
    .stat-label { font-size:12px; color:var(--text-2); margin-top:2px; }
    .bar-wrap { margin-bottom:0.5rem; }
    .bar-label { display:flex; justify-content:space-between; font-size:12px; color:var(--text-2); margin-bottom:3px; }
    .bar-track { height:8px; background:var(--bg-3); border-radius:4px; overflow:hidden; }
    .bar-fill { height:100%; background:var(--green); border-radius:4px; }
    .bar-fill.blue { background:var(--blue); }
    .bar-fill.purple { background:var(--purple); }
    .admin-list { max-height:280px; overflow-y:auto; margin-bottom:1rem; }
    .admin-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:0.5px solid var(--border); }
    .admin-row:last-child { border-bottom:none; }
    .export-row { display:flex; gap:8px; margin-bottom:1rem; }
    .info-box { background:var(--green-light); border-radius:var(--radius); padding:0.6rem 0.75rem; font-size:12px; color:var(--green-dark); margin-bottom:1rem; display:flex; align-items:flex-start; gap:6px; line-height:1.5; }
    .info-box i { flex-shrink:0; margin-top:1px; }
    .toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); font-size:13px; padding:8px 18px; border-radius:var(--radius); white-space:nowrap; opacity:0; transition:opacity 0.2s; pointer-events:none; z-index:99; font-family:inherit; }
    .toast.ok { background:var(--green-dark); color:var(--green-light); }
    .toast.err { background:var(--red); color:#fff; }
    .toast.show { opacity:1; }
    .empty { font-size:13px; color:var(--text-3); padding:1.5rem 0; text-align:center; }
    .loading { font-size:13px; color:var(--text-3); padding:1rem 0; text-align:center; }
    .admin-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <div>
      <h1>St. Paul's Young Adults</h1>
      <p id="date-label"></p>
    </div>
    <a class="nav-link" href="admin.html"><i class="ti ti-lock" style="font-size:14px;"></i> Admin</a>
  </div>

  <div class="tab-row">
    <button class="tab active" id="tab-checkin" onclick="showTab('checkin')">Check in</button>
    <button class="tab"        id="tab-tonight" onclick="showTab('tonight')">Tonight</button>
  </div>

  <!-- CHECK IN -->
  <div id="view-checkin">
    <select class="event-select" id="event-type">
      <option>Wednesday Night</option>
      <option>Mass</option>
      <option>Service Day</option>
      <option>Social Event</option>
      <option>Faith Formation</option>
      <option>Other</option>
    </select>

    <div class="seg">
      <button id="seg-name"  class="active" onclick="setSearchMode('name')">Find by name</button>
      <button id="seg-phone"            onclick="setSearchMode('phone')">Find by phone</button>
    </div>

    <div class="search-wrap">
      <i class="ti ti-search" id="search-icon"></i>
      <input type="text" id="search" placeholder="Search your name…"
             oninput="onSearchInput()" autocomplete="off" />
    </div>

    <div class="roster" id="roster">
      <div class="loading">Connecting…</div>
    </div>

    <div class="divider">New member</div>
    <div class="surface">
      <div class="field">
        <label>Full name</label>
        <input type="text" id="new-name" placeholder="First Last" autocomplete="off" />
      </div>
      <div class="field">
        <label>Email <span style="color:var(--text-3)">(private — admin only)</span></label>
        <input type="email" id="new-email" placeholder="email@example.com" autocomplete="off" />
      </div>
      <div class="field">
        <label>Phone <span style="color:var(--text-3)">(for sign-in lookup)</span></label>
        <input type="tel" id="new-phone" placeholder="(555) 123-4567" autocomplete="off" />
      </div>
      <div class="field">
        <label>Age bracket</label>
        <select id="new-age">
          <option value="">Select…</option>
          <option value="20-29">20–29</option>
          <option value="30-39">30–39</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="addMember()">Add &amp; check in</button>
    </div>
  </div>

  <!-- TONIGHT -->
  <div id="view-tonight" style="display:none;">
    <div class="stats">
      <div class="stat"><div class="stat-val" id="stat-total">0</div><div class="stat-label">Checked in</div></div>
      <div class="stat"><div class="stat-val" id="stat-new">0</div><div class="stat-label">First-timers</div></div>
    </div>
    <div class="divider">Attendees</div>
    <div class="roster" id="summary-list"><div class="empty">No one checked in yet</div></div>
  </div>

</div>
<div class="toast ok" id="toast"></div>

<script type="module">
import { initializeApp }                from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInAnonymously }   from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc,
         onSnapshot, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyBGoE6EWX6v_ypOPZHNyMfmC7Ftx29yB3s",
  authDomain:        "stpauls-attendance.firebaseapp.com",
  projectId:         "stpauls-attendance",
  storageBucket:     "stpauls-attendance.firebasestorage.app",
  messagingSenderId: "1014861796944",
  appId:             "1:1014861796944:web:d0968de930820150d1e355",
  measurementId:     "G-9C6PJCB2ZT"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const TODAY = new Date().toISOString().slice(0, 10);
document.getElementById('date-label').textContent = new Date().toLocaleDateString('en-US', {
  weekday: 'long', month: 'long', day: 'numeric'
});

let rosterCache = [], todayCheckins = [];
let searchMode = 'name';
let phoneSearchHash = null;

signInAnonymously(auth).catch(e => console.warn('Anon auth:', e.message));

// ── Phone hashing ─────────────────────────────────────────────────────────────
function normalizePhone(p) { return (p || '').replace(/\D/g, '').slice(-10); }
async function hashPhone(p) {
  const digits = normalizePhone(p);
  if (digits.length !== 10) return null;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(digits));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ── Data ──────────────────────────────────────────────────────────────────────
onSnapshot(query(collection(db, 'roster'), orderBy('name')), snap => {
  rosterCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderRoster();
});
onSnapshot(query(collection(db, 'checkins'), where('date', '==', TODAY)), snap => {
  todayCheckins = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderRoster();
  renderSummary();
});

// ── Search ──────────────────────────────────────────────────────────────────
window.setSearchMode = function (mode) {
  searchMode = mode;
  document.getElementById('seg-name').className  = mode === 'name'  ? 'active' : '';
  document.getElementById('seg-phone').className = mode === 'phone' ? 'active' : '';
  const inp = document.getElementById('search');
  inp.value = '';
  phoneSearchHash = null;
  if (mode === 'phone') { inp.type = 'tel'; inp.placeholder = 'Enter your full phone number'; document.getElementById('search-icon').className = 'ti ti-phone'; }
  else { inp.type = 'text'; inp.placeholder = 'Search your name…'; document.getElementById('search-icon').className = 'ti ti-search'; }
  renderRoster();
};

window.onSearchInput = async function () {
  if (searchMode === 'phone') {
    phoneSearchHash = await hashPhone(document.getElementById('search').value);
  }
  renderRoster();
};

// ── Render ──────────────────────────────────────────────────────────────────
function initials(n) { return n.trim().split(' ').map(p => p[0] || '').join('').toUpperCase().slice(0, 2); }
function isCI(id) { return todayCheckins.some(c => c.memberId === id); }

function renderRoster() {
  const el = document.getElementById('roster');
  if (!rosterCache.length) { el.innerHTML = '<div class="loading">Connecting…</div>'; return; }

  let filtered;
  if (searchMode === 'phone') {
    if (!phoneSearchHash) { el.innerHTML = '<div class="empty">Enter your full phone number to find yourself</div>'; return; }
    filtered = rosterCache.filter(m => m.phoneHash && m.phoneHash === phoneSearchHash);
    if (!filtered.length) { el.innerHTML = '<div class="empty">No match — check the number or add yourself below</div>'; return; }
  } else {
    const q = document.getElementById('search').value.toLowerCase();
    filtered = rosterCache.filter(m => m.name.toLowerCase().includes(q));
    if (!filtered.length) { el.innerHTML = '<div class="empty">No members found</div>'; return; }
  }

  el.innerHTML = filtered.map(m => {
    const ci = isCI(m.id);
    return '<button class="member-btn ' + (ci ? 'ci' : '') + '" onclick="checkIn(\'' + m.id + '\')">' +
      '<div class="avatar ' + (ci ? 'green' : '') + '">' + initials(m.name) + '</div>' +
      '<div style="flex:1;"><div class="member-name">' + m.name + '</div></div>' +
      (ci ? '<i class="ti ti-check check-icon"></i>' : '') +
    '</button>';
  }).join('');
}

function renderSummary() {
  document.getElementById('stat-total').textContent = todayCheckins.length;
  document.getElementById('stat-new').textContent   = todayCheckins.filter(c => c.isNew).length;
  const sl = document.getElementById('summary-list');
  if (!todayCheckins.length) { sl.innerHTML = '<div class="empty">No one checked in yet</div>'; return; }
  sl.innerHTML = todayCheckins.map(c =>
    '<div class="member-btn static">' +
      '<div class="avatar green">' + initials(c.memberName || '?') + '</div>' +
      '<div style="flex:1;"><div class="member-name">' + c.memberName + '</div>' +
      '<div class="member-sub">' + c.event + (c.isNew ? ' · First time' : '') + '</div></div>' +
      '<i class="ti ti-check check-icon"></i>' +
    '</div>').join('');
}

// ── Actions ───────────────────────────────────────────────────────────────────
window.checkIn = async function (id) {
  if (isCI(id)) { showToast('Already checked in', 'err'); return; }
  const event = document.getElementById('event-type').value;
  const m = rosterCache.find(r => r.id === id);
  if (!m) return;
  try {
    await addDoc(collection(db, 'checkins'), {
      memberId: id, memberName: m.name, date: TODAY, event, isNew: m.isNew || false, ts: Date.now()
    });
    if (m.isNew) await updateDoc(doc(db, 'roster', id), { isNew: false });
    showToast('✓ ' + m.name + ' checked in');
  } catch (e) { showToast('Check-in failed', 'err'); console.error(e); }
};

window.addMember = async function () {
  const name = document.getElementById('new-name').value.trim();
  if (!name) { showToast('Enter a name', 'err'); return; }
  const email = document.getElementById('new-email').value.trim();
  const phone = document.getElementById('new-phone').value.trim();
  const age   = document.getElementById('new-age').value;
  try {
    const phoneHash = phone ? await hashPhone(phone) : null;
    const ref = doc(collection(db, 'roster'));
    const rosterDoc = { name, isNew: true, joined: TODAY };
    if (phoneHash) rosterDoc.phoneHash = phoneHash;
    await setDoc(ref, rosterDoc);
    if (email || phone || age) {
      await setDoc(doc(db, 'contacts', ref.id), { email: email || '', phone: phone || '', ageBracket: age || '' });
    }
    await window.checkIn(ref.id);
    document.getElementById('new-name').value  = '';
    document.getElementById('new-email').value = '';
    document.getElementById('new-phone').value = '';
    document.getElementById('new-age').value   = '';
    document.getElementById('search').value    = '';
  } catch (e) { showToast('Could not add member', 'err'); console.error(e); }
};

function showToast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 2400);
}

window.showTab = function (tab) {
  ['checkin', 'tonight'].forEach(t => {
    document.getElementById('view-' + t).style.display = t === tab ? '' : 'none';
    document.getElementById('tab-' + t).className = 'tab' + (t === tab ? ' active' : '');
  });
  if (tab === 'tonight') renderSummary();
};
</script>
</body>
</html>
