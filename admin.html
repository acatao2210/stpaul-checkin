<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>St. Paul's Young Adults · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:#0F6E56; --green-light:#E1F5EE; --green-mid:#9FE1CB; --green-dark:#085041;
      --blue:#185FA5; --blue-light:#E6F1FB; --red:#A32D2D; --red-light:#FCEBEB;
      --amber-light:#FAEEDA; --amber-dark:#633806; --purple:#534AB7; --purple-light:#EEEDFE;
      --text:#111; --text-2:#555; --text-3:#999; --bg:#fff; --bg-2:#f7f7f5; --bg-3:#ededeb;
      --border:#e5e5e3; --border-2:#d0d0ce; --radius:8px; --radius-lg:12px;
    }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--bg-2); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:0 1rem 3rem; }
    .app { width:100%; max-width:420px; }
    .header { padding:1.25rem 0 1rem; border-bottom:0.5px solid var(--border); margin-bottom:1.25rem; display:flex; justify-content:space-between; align-items:flex-start; }
    .header h1 { font-size:18px; font-weight:500; }
    .header p { font-size:13px; color:var(--text-2); margin-top:2px; }
    .nav-link { font-size:12px; color:var(--text-2); text-decoration:none; border:0.5px solid var(--border-2); padding:6px 10px; border-radius:var(--radius); white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
    .nav-link:hover { background:var(--bg); }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 14px; font-size:14px; font-family:inherit; font-weight:500; border-radius:var(--radius); cursor:pointer; border:none; }
    .btn-primary { background:var(--text); color:var(--bg); width:100%; }
    .btn-outline { background:var(--bg); color:var(--text); border:0.5px solid var(--border-2); }
    .btn-sm { padding:6px 10px; font-size:12px; }
    .btn-danger { color:var(--red); border-color:#F09595; background:transparent; }
    .roster { display:flex; flex-direction:column; gap:6px; max-height:300px; overflow-y:auto; margin-bottom:1rem; }
    .member-name { font-size:14px; font-weight:500; }
    .member-sub { font-size:12px; color:var(--text-2); }
    .divider { font-size:11px; font-weight:500; color:var(--text-3); text-transform:uppercase; letter-spacing:0.06em; margin:1rem 0 0.5rem; }
    .card { background:var(--bg); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:1rem 1.25rem; margin-bottom:1rem; }
    .bar-wrap { margin-bottom:0.5rem; }
    .bar-label { display:flex; justify-content:space-between; font-size:12px; color:var(--text-2); margin-bottom:3px; }
    .bar-track { height:8px; background:var(--bg-3); border-radius:4px; overflow:hidden; }
    .bar-fill { height:100%; background:var(--green); border-radius:4px; }
    .bar-fill.blue { background:var(--blue); }
    .bar-fill.purple { background:var(--purple); }
    .admin-list { max-height:280px; overflow-y:auto; margin-bottom:1rem; }
    .admin-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:0.5px solid var(--border); }
    .info-box { background:var(--green-light); border-radius:var(--radius); padding:0.6rem 0.75rem; font-size:12px; color:var(--green-dark); margin-bottom:1rem; }
    .toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); font-size:13px; padding:8px 18px; border-radius:var(--radius); white-space:nowrap; opacity:0; transition:opacity 0.2s; z-index:99; }
    .toast.ok { background:var(--green-dark); color:var(--green-light); }
    .toast.show { opacity:1; }
    .admin-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }

    /* Login inputs */
    #admin-login input {
      display:block; width:100%; padding:9px 12px; font-size:14px;
      font-family:inherit; border:0.5px solid var(--border-2);
      border-radius:var(--radius); background:var(--bg);
      color:var(--text); outline:none; margin-bottom:8px;
    }
    #admin-login input:focus { border-color:var(--green); }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div><h1>Admin Panel</h1><p>St. Paul's Young Adults</p></div>
    <a class="nav-link" href="index.html"><i class="ti ti-arrow-left"></i> Check-in</a>
  </div>

  <div id="admin-login">
    <div class="card">
      <input type="email" id="admin-email" placeholder="Admin email" />
      <input type="password" id="admin-password" placeholder="Password" />
      <button class="btn btn-primary" onclick="adminLogin()">Sign in</button>
    </div>
  </div>

  <div id="admin-content" style="display:none;">
    <div class="admin-top">
      <p style="font-size:13px;color:var(--text-2);" id="admin-user-label"></p>
      <button class="btn btn-outline btn-sm" onclick="adminLogout()">Sign out</button>
    </div>

    <div class="divider">Checked in today</div>
    <div id="daily-checkins-list" class="roster" style="display:flex; flex-wrap:wrap; gap:8px; flex-direction:row; margin-bottom:1.5rem;"></div>

  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, doc, deleteDoc, getDocs, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBGoE6EWX6v_ypOPZHNyMfmC7Ftx29yB3s",
  authDomain: "stpauls-attendance.firebaseapp.com",
  projectId: "stpauls-attendance",
  storageBucket: "stpauls-attendance.firebasestorage.app",
  messagingSenderId: "1014861796944",
  appId: "1:1014861796944:web:d0968de930820150d1e355",
  measurementId: "G-9C6PJCB2ZT"
};
const app = initializeApp(firebaseConfig);

// ── App Check ─────────────────────────────────────────────────────────────────
// On localhost, App Check prints a debug token to the console on first run.
// Copy that token into Firebase Console → App Check → Debug tokens.
if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
  self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
}
initializeAppCheck(app, {
  provider: new ReCaptchaV3Provider('6LfRchYtAAAAACLhqSUtfs0oiLvjn7SvD4ZAvTY-'),
  isTokenAutoRefreshEnabled: true
});

const auth = getAuth(app);
const db = getFirestore(app);

let rosterCache = [], checkinsCache = [], contactsCache = {};
let listenersStarted = false;

function calculateAge(birthYear) { return birthYear ? 2026 - parseInt(birthYear) : null; }

// ── Auth ──────────────────────────────────────────────────────────────────────
// Firestore rules now require isAuthenticated() for roster and checkin reads.
// Listeners must start AFTER auth resolves — otherwise the first snapshot
// fires before the session is established and is denied.
// Admin access also requires the { admin: true } custom claim (set via
// set-admin-claim.js). Standard email/password sign-in is still used here;
// the claim is evaluated server-side by Firestore rules.

onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById('admin-login').style.display = 'none';
    document.getElementById('admin-content').style.display = '';
    document.getElementById('admin-user-label').textContent = user.email;

    // Start real-time listeners only once per session
    if (!listenersStarted) {
      listenersStarted = true;
      loadContacts();

      onSnapshot(query(collection(db, 'roster'), orderBy('name')), snap => {
        rosterCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderAll();
      });

      onSnapshot(query(collection(db, 'checkins'), orderBy('ts', 'desc')), snap => {
        checkinsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderAll();
      });
    }
  } else {
    // User signed out — reset state
    listenersStarted = false;
    rosterCache = [];
    checkinsCache = [];
    contactsCache = {};
    document.getElementById('admin-login').style.display = '';
    document.getElementById('admin-content').style.display = 'none';
  }
});

async function loadContacts() {
  const snap = await getDocs(collection(db, 'contacts'));
  snap.docs.forEach(d => { contactsCache[d.id] = d.data(); });
  renderAll();
}

function renderDailyCheckins() {
  const el = document.getElementById('daily-checkins-list');
  const today = new Date().toISOString().slice(0, 10);
  const attendees = checkinsCache.filter(c => c.date === today);
  
  if (!attendees.length) { el.innerHTML = '<div class="empty">No check-ins yet</div>'; return; }
  el.innerHTML = attendees.map(c => {
    const m = rosterCache.find(r => r.id === c.memberId) || {};
    const contact = contactsCache[c.memberId] || {};
    const isBirthMonth = contact.birthMonth == (new Date().getMonth() + 1);
    const name = (m.firstName || c.memberName).split(' ')[0] + ' ' + (m.lastName ? m.lastName[0] + '.' : '');
    const bracket = c.ageBracket;
    const bracketStyle = bracket === "20-29"
      ? "background:var(--blue-light); color:var(--blue);"
      : bracket === "30-39"
      ? "background:var(--purple-light); color:var(--purple);"
      : "";
    
    return `
      <div style="background:#fff; border:0.5px solid #e5e5e3; padding:10px; border-radius:8px; width:calc(50% - 4px); ${c.isNew ? 'border:1.5px solid #0F6E56;' : ''}">
        <div style="font-size:14px; font-weight:600;">${name} ${isBirthMonth ? '🎂' : ''}</div>
        ${bracket ? `<div style="display:inline-block; font-size:10px; font-weight:600; padding:2px 6px; border-radius:4px; margin-top:3px; ${bracketStyle}">${bracket}</div>` : ''}
        ${c.isNew ? '<div style="font-size:10px; color:#0F6E56; font-weight:700; margin-top:2px;">NEW</div>' : ''}
      </div>`;
  }).join('');
}

function renderAll() {
  renderDailyCheckins();
  // Placeholder for other render functions...
}

window.adminLogin = async () => { 
  const e = document.getElementById('admin-email').value;
  const p = document.getElementById('admin-password').value;
  await signInWithEmailAndPassword(auth, e, p).catch(err => alert(err.message));
};

window.adminLogout = () => { 
  signOut(auth);
  // onAuthStateChanged will handle UI reset; no need for location.reload()
};
</script>
</body>
</html>
