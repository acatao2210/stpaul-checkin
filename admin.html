<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>St. Paul's Young Adults · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:#0F6E56; --green-light:#E1F5EE; --green-mid:#9FE1CB; --green-dark:#085041;
      --blue:#185FA5; --blue-light:#E6F1FB; --red:#A32D2D; --red-light:#FCEBEB;
      --amber-light:#FAEEDA; --amber-dark:#633806; --purple:#534AB7; --purple-light:#EEEDFE;
      --text:#111; --text-2:#555; --text-3:#999; --bg:#fff; --bg-2:#f7f7f5; --bg-3:#ededeb;
      --border:#e5e5e3; --border-2:#d0d0ce; --radius:8px; --radius-lg:12px;
    }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--bg-2); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:0 1rem 3rem; }
    .app { width:100%; max-width:420px; }
    .header { padding:1.25rem 0 1rem; border-bottom:0.5px solid var(--border); margin-bottom:1.25rem; display:flex; justify-content:space-between; align-items:flex-start; }
    .header h1 { font-size:18px; font-weight:500; }
    .header p { font-size:13px; color:var(--text-2); margin-top:2px; }
    .nav-link { font-size:12px; color:var(--text-2); text-decoration:none; border:0.5px solid var(--border-2); padding:6px 10px; border-radius:var(--radius); white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
    .nav-link:hover { background:var(--bg); }
    .tab-row { display:flex; gap:6px; margin-bottom:1.25rem; }
    .tab { flex:1; padding:8px 4px; font-size:13px; font-family:inherit; border:0.5px solid var(--border-2); border-radius:var(--radius); background:var(--bg); cursor:pointer; color:var(--text-2); }
    .tab.active { background:var(--text); color:var(--bg); border-color:var(--text); }
    input, select { width:100%; padding:9px 12px; font-size:14px; font-family:inherit; border:0.5px solid var(--border-2); border-radius:var(--radius); background:var(--bg); color:var(--text); outline:none; }
    input:focus, select:focus { border-color:var(--green); }
    input[type=password] { letter-spacing:0.1em; }
    .seg { display:flex; gap:0; margin-bottom:0.75rem; border:0.5px solid var(--border-2); border-radius:var(--radius); overflow:hidden; }
    .seg button { flex:1; padding:8px; font-size:13px; font-family:inherit; background:var(--bg); border:none; cursor:pointer; color:var(--text-2); }
    .seg button.active { background:var(--text); color:var(--bg); }
    .search-wrap { position:relative; margin-bottom:0.75rem; }
    .search-wrap i { position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:16px; color:var(--text-3); pointer-events:none; }
    .search-wrap input { padding-left:34px; }
    .event-select { margin-bottom:1.25rem; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 14px; font-size:14px; font-family:inherit; font-weight:500; border-radius:var(--radius); cursor:pointer; border:none; }
    .btn:active { opacity:0.82; }
    .btn-primary { background:var(--text); color:var(--bg); width:100%; }
    .btn-outline { background:var(--bg); color:var(--text); border:0.5px solid var(--border-2); }
    .btn-outline:hover { background:var(--bg-2); }
    .btn-sm { padding:6px 10px; font-size:12px; }
    .btn-danger { color:var(--red); border-color:#F09595; background:transparent; }
    .btn-danger:hover { background:var(--red-light); }
    .roster { display:flex; flex-direction:column; gap:6px; max-height:300px; overflow-y:auto; margin-bottom:1rem; }
    .member-btn { display:flex; align-items:center; gap:10px; background:var(--bg); border:0.5px solid var(--border); border-radius:var(--radius); padding:10px 12px; cursor:pointer; text-align:left; width:100%; font-family:inherit; }
    .member-btn:hover { background:var(--bg-2); }
    .member-btn.ci { border-color:var(--green); background:var(--green-light); }
    .member-btn.static { cursor:default; }
    .avatar { width:36px; height:36px; border-radius:50%; background:var(--blue-light); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:500; color:var(--blue); flex-shrink:0; }
    .avatar.green { background:var(--green-mid); color:var(--green-dark); }
    .avatar.amber { background:var(--amber-light); color:var(--amber-dark); }
    .member-name { font-size:14px; font-weight:500; }
    .member-sub { font-size:12px; color:var(--text-2); }
    .check-icon { color:var(--green); font-size:18px; margin-left:auto; }
    .divider { font-size:11px; font-weight:500; color:var(--text-3); text-transform:uppercase; letter-spacing:0.06em; margin:1rem 0 0.5rem; }
    .surface { background:var(--bg-2); border-radius:var(--radius-lg); padding:1rem; margin-bottom:1rem; }
    .field { margin-bottom:0.75rem; }
    .field label { display:block; font-size:12px; color:var(--text-2); margin-bottom:4px; }
    .card { background:var(--bg); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:1rem 1.25rem; margin-bottom:1rem; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:1.25rem; }
    .stat { background:var(--bg-2); border-radius:var(--radius); padding:0.75rem; }
    .stat-val { font-size:24px; font-weight:500; }
    .stat-label { font-size:12px; color:var(--text-2); margin-top:2px; }
    .bar-wrap { margin-bottom:0.5rem; }
    .bar-label { display:flex; justify-content:space-between; font-size:12px; color:var(--text-2); margin-bottom:3px; }
    .bar-track { height:8px; background:var(--bg-3); border-radius:4px; overflow:hidden; }
    .bar-fill { height:100%; background:var(--green); border-radius:4px; }
    .bar-fill.blue { background:var(--blue); }
    .bar-fill.purple { background:var(--purple); }
    .admin-list { max-height:280px; overflow-y:auto; margin-bottom:1rem; }
    .admin-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:0.5px solid var(--border); }
    .admin-row:last-child { border-bottom:none; }
    .export-row { display:flex; gap:8px; margin-bottom:1rem; }
    .info-box { background:var(--green-light); border-radius:var(--radius); padding:0.6rem 0.75rem; font-size:12px; color:var(--green-dark); margin-bottom:1rem; display:flex; align-items:flex-start; gap:6px; line-height:1.5; }
    .info-box i { flex-shrink:0; margin-top:1px; }
    .toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); font-size:13px; padding:8px 18px; border-radius:var(--radius); white-space:nowrap; opacity:0; transition:opacity 0.2s; pointer-events:none; z-index:99; font-family:inherit; }
    .toast.ok { background:var(--green-dark); color:var(--green-light); }
    .toast.err { background:var(--red); color:#fff; }
    .toast.show { opacity:1; }
    .empty { font-size:13px; color:var(--text-3); padding:1.5rem 0; text-align:center; }
    .loading { font-size:13px; color:var(--text-3); padding:1rem 0; text-align:center; }
    .admin-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <div>
      <h1>Admin Panel</h1>
      <p>St. Paul's Young Adults</p>
    </div>
    <a class="nav-link" href="index.html"><i class="ti ti-arrow-left" style="font-size:14px;"></i> Check-in</a>
  </div>

  <!-- Login gate -->
  <div id="admin-login">
    <div class="card">
      <p style="font-size:14px;font-weight:500;margin-bottom:4px;">Sign in</p>
      <p style="font-size:12px;color:var(--text-2);margin-bottom:1rem;">Use the email and password from your Firebase Auth account.</p>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <input type="email"    id="admin-email"    placeholder="Admin email" />
        <input type="password" id="admin-password" placeholder="Password" onkeydown="if(event.key==='Enter')adminLogin()" />
        <button class="btn btn-primary" onclick="adminLogin()">Sign in</button>
      </div>
    </div>
  </div>

  <!-- Admin content -->
  <div id="admin-content" style="display:none;">
    <div class="admin-top">
      <p style="font-size:13px;color:var(--text-2);" id="admin-user-label"></p>
      <button class="btn btn-outline btn-sm" onclick="adminLogout()"><i class="ti ti-logout" style="font-size:14px;"></i> Sign out</button>
    </div>

    <div class="info-box"><i class="ti ti-shield-check"></i> Contact details load only after sign-in and are never sent to the public check-in page.</div>

    <div class="divider">Export</div>
    <div class="export-row">
      <button class="btn btn-outline" onclick="exportCSV('attendance')"><i class="ti ti-download"></i> Attendance</button>
      <button class="btn btn-outline" onclick="exportCSV('roster')"><i class="ti ti-download"></i> Roster</button>
    </div>

    <div class="divider">Attendance trends</div>
    <div id="trends-section" style="margin-bottom:1rem;"></div>

    <div class="divider">Event breakdown</div>
    <div id="event-breakdown" style="margin-bottom:1rem;"></div>

    <div class="divider">Age brackets</div>
    <div id="age-breakdown" style="margin-bottom:1rem;"></div>

    <div class="divider">Members <span id="roster-count" style="color:var(--text-3);font-weight:400;font-size:11px;"></span></div>
    <div class="admin-list" id="admin-roster"></div>
  </div>

</div>
<div class="toast ok" id="toast"></div>

<script type="module">
import { initializeApp }                from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithEmailAndPassword, signOut, onAuthStateChanged }
                                        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, doc, deleteDoc, getDocs, onSnapshot, query, orderBy }
                                        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyBGoE6EWX6v_ypOPZHNyMfmC7Ftx29yB3s",
  authDomain:        "stpauls-attendance.firebaseapp.com",
  projectId:         "stpauls-attendance",
  storageBucket:     "stpauls-attendance.firebasestorage.app",
  messagingSenderId: "1014861796944",
  appId:             "1:1014861796944:web:d0968de930820150d1e355",
  measurementId:     "G-9C6PJCB2ZT"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

let rosterCache = [], checkinsCache = [], contactsCache = {};
let isAdmin = false;

onAuthStateChanged(auth, user => {
  if (user && !user.isAnonymous) {
    isAdmin = true;
    document.getElementById('admin-login').style.display   = 'none';
    document.getElementById('admin-content').style.display = '';
    document.getElementById('admin-user-label').textContent = user.email;
    loadContacts();
    renderAll();
  } else {
    isAdmin = false;
    contactsCache = {};
    document.getElementById('admin-login').style.display   = '';
    document.getElementById('admin-content').style.display = 'none';
  }
});

window.adminLogin = async function () {
  const email = document.getElementById('admin-email').value.trim();
  const pw    = document.getElementById('admin-password').value;
  if (!email || !pw) { showToast('Enter email and password', 'err'); return; }
  try { await signInWithEmailAndPassword(auth, email, pw); }
  catch (e) {
    const msg = ['auth/wrong-password','auth/user-not-found','auth/invalid-credential'].includes(e.code)
      ? 'Incorrect email or password' : e.message;
    showToast(msg, 'err');
  }
};

window.adminLogout = async function () {
  contactsCache = {};
  await signOut(auth);
  showToast('Signed out');
  document.getElementById('admin-email').value    = '';
  document.getElementById('admin-password').value = '';
};

// ── Live data (roster + checkins are public; safe to listen anytime) ──────────
onSnapshot(query(collection(db, 'roster'), orderBy('name')), snap => {
  rosterCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  if (isAdmin) renderAll();
});
onSnapshot(query(collection(db, 'checkins'), orderBy('ts', 'desc')), snap => {
  checkinsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  if (isAdmin) renderAll();
});

async function loadContacts() {
  try {
    const snap = await getDocs(collection(db, 'contacts'));
    contactsCache = {};
    snap.docs.forEach(d => { contactsCache[d.id] = d.data(); });
    renderAll();
  } catch (e) { showToast('Could not load contacts: ' + e.message, 'err'); }
}

// ── Render ──────────────────────────────────────────────────────────────────
function initials(n) { return n.trim().split(' ').map(p => p[0] || '').join('').toUpperCase().slice(0, 2); }

function renderAll() {
  document.getElementById('roster-count').textContent = '(' + rosterCache.length + ')';
  renderTrends(); renderEventBreakdown(); renderAgeBreakdown(); renderAdminRoster();
}

function bars(entries, total, cls) {
  if (!entries.length) return '<div class="empty">No data yet</div>';
  const max = Math.max(...entries.map(e => e[1]));
  return entries.map(([label, cnt]) => {
    const pct = max > 0 ? Math.round((cnt / max) * 100) : 0;
    const extra = total ? ' (' + Math.round((cnt / total) * 100) + '%)' : '';
    return '<div class="bar-wrap"><div class="bar-label"><span>' + label + '</span><span>' + cnt + extra + '</span></div>' +
      '<div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + pct + '%"></div></div></div>';
  }).join('');
}

function renderTrends() {
  const byDate = {};
  checkinsCache.forEach(c => { byDate[c.date] = (byDate[c.date] || 0) + 1; });
  const dates = Object.keys(byDate).sort().slice(-8);
  const entries = dates.map(d => [new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), byDate[d]]);
  document.getElementById('trends-section').innerHTML = bars(entries, 0, '');
}

function renderEventBreakdown() {
  const byEvt = {};
  checkinsCache.forEach(c => { byEvt[c.event] = (byEvt[c.event] || 0) + 1; });
  const entries = Object.entries(byEvt).sort((a, b) => b[1] - a[1]);
  document.getElementById('event-breakdown').innerHTML = bars(entries, checkinsCache.length, 'blue');
}

function renderAgeBreakdown() {
  const byAge = {};
  rosterCache.forEach(m => {
    const a = (contactsCache[m.id] && contactsCache[m.id].ageBracket) || 'Unknown';
    byAge[a] = (byAge[a] || 0) + 1;
  });
  const order = ['20-29', '30-39', 'Unknown'];
  const entries = Object.entries(byAge).sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]))
    .map(([k, v]) => [k === '20-29' ? '20–29' : k === '30-39' ? '30–39' : k, v]);
  document.getElementById('age-breakdown').innerHTML = bars(entries, rosterCache.length, 'purple');
}

function renderAdminRoster() {
  const el = document.getElementById('admin-roster');
  if (!rosterCache.length) { el.innerHTML = '<div class="empty">No members yet</div>'; return; }
  el.innerHTML = rosterCache.map(m => {
    const visits = checkinsCache.filter(c => c.memberId === m.id).length;
    const c = contactsCache[m.id] || {};
    const parts = [];
    if (c.email) parts.push(c.email);
    if (c.phone) parts.push(c.phone);
    if (c.ageBracket) parts.push(c.ageBracket === '20-29' ? '20–29' : '30–39');
    const sub = (parts.join(' · ') || 'No contact info') + ' · ' + visits + ' visit' + (visits !== 1 ? 's' : '');
    return '<div class="admin-row">' +
      '<div class="avatar amber">' + initials(m.name) + '</div>' +
      '<div style="flex:1;"><div class="member-name">' + m.name + '</div><div class="member-sub">' + sub + '</div></div>' +
      '<button class="btn btn-outline btn-sm btn-danger" onclick="removeMember(\'' + m.id + '\')">Remove</button>' +
    '</div>';
  }).join('');
}

window.removeMember = async function (id) {
  if (!confirm('Remove this member?')) return;
  try {
    await deleteDoc(doc(db, 'roster', id));
    await deleteDoc(doc(db, 'contacts', id)).catch(() => {});
    delete contactsCache[id];
    showToast('Member removed');
  } catch (e) { showToast('Could not remove member', 'err'); }
};

// ── Export ────────────────────────────────────────────────────────────────────
window.exportCSV = function (type) {
  let csv = '', filename = '';
  const esc = s => ('' + (s || '')).replace(/"/g, '""');
  if (type === 'attendance') {
    csv = 'Date,Event,Name,First Timer\n';
    checkinsCache.forEach(c => { csv += c.date + ',"' + esc(c.event) + '","' + esc(c.memberName) + '",' + (c.isNew ? 'Yes' : 'No') + '\n'; });
    filename = 'attendance.csv';
  } else {
    csv = 'Name,Email,Phone,Age Bracket,Joined,Total Visits\n';
    rosterCache.forEach(m => {
      const c = contactsCache[m.id] || {};
      const visits = checkinsCache.filter(x => x.memberId === m.id).length;
      csv += '"' + esc(m.name) + '","' + esc(c.email) + '","' + esc(c.phone) + '","' + esc(c.ageBracket) + '","' + (m.joined || '') + '",' + visits + '\n';
    });
    filename = 'roster.csv';
  }
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  showToast('Exported ' + filename);
};

function showToast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 2400);
}
</script>
</body>
</html>
